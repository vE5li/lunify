name: Tests

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install grcov
        uses: taiki-e/install-action@v2
        with:
          tool: grcov

      - name: Run tests
        run: cargo test --features integration --no-fail-fast
        env:
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: -Cinstrument-coverage
          LLVM_PROFILE_FILE: ${{ github.workspace }}/target/coverage/lunify-%p-%m.profraw

      - name: Generate coverage report
        run: >
          grcov target/coverage
          --binary-path target/debug
          --source-dir .
          --output-type html
          --output-path coverage
          --branch
          --ignore-not-existing
          --ignore "/*"
          --ignore "target/*"

      - uses: actions/upload-artifact@v4
        with:
          name: Coverage
          path: coverage

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: popsiclestick/gist-sync-action@v1.2.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gist_url: https://gist.github.com/vE5li/173a7aa9ac7d5e82e238048e06aa99c2
          gist_title: lunify-coverage-badge.svg
          gist_description: Lunify coverage badge
          github_file: coverage/badges/flat.svg
