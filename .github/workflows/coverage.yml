name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Generate coverage report
        run: nix build --print-build-logs --out-link coverage .#coverage

      - uses: actions/upload-artifact@v4
        with:
          name: Coverage
          path: coverage/

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: popsiclestick/gist-sync-action@v1.2.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gist_url: https://gist.github.com/vE5li/173a7aa9ac7d5e82e238048e06aa99c2
          gist_title: lunify-coverage-badge.svg
          gist_description: Lunify coverage badge
          github_file: coverage/badges/flat.svg
