[package]
name = "lunify"
version = "2.0.0"
edition = "2024"
description = "A crate for converting Lua byte code to different versions and formats"
readme = "README.md"
homepage = "https://github.com/vE5li/lunify"
repository = "https://github.com/vE5li/lunify"
license = "MIT"
keywords = ["bytecode", "lua"]
categories = ["encoding"]
exclude = ["LICENSE.md", "rustfmt.toml", "test_files/"]

[dependencies]
mlua = { version = "0.12.2", features = ["lua51", "vendored"], optional = true }
serde = { version = "1.0.229", features = ["serde_derive"], optional = true }

[features]
debug = []
integration = ["mlua"]
